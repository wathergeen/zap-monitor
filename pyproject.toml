[project]
name = "zap-bot"
version = "0.1.0"
description = "Monitor de grupos WhatsApp somente leitura via Evolution API e Django"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "psycopg[binary]>=3.2.0",
    "procrastinate[django]>=3.10.0",
    "argon2-cffi>=23.1.0",
    "django-axes>=6.5.0",
    "django-otp>=1.5.0",
    "qrcode>=8.0",
    "django-csp>=3.8",
    "django-ratelimit>=4.1.0",
    "python-dotenv>=1.0.1",
    "whitenoise[brotli]>=6.7.0",
    "gunicorn>=23.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-django>=4.9.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "django-stubs>=5.0.0",
    "bandit>=1.7.9",
    "pip-audit>=2.7.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "migrations",
    "static",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "B"]
ignore = [
    "E501", # line length handled by formatter
    "S101", # assert allowed in tests
    "S104", # binding to all interfaces (used in container)
    "S105", # hardcoded password checks (addressed in production settings checks)
    "S106",
    "B008", # function calls in argument defaults (forms/fields)
]

[tool.ruff.lint.per-file-ignores]
"core/settings/*.py" = ["F403", "F405"]
"scripts/*" = ["S310", "S311"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings.dev"
python_files = ["test_*.py", "*_test.py"]
addopts = "--strict-markers"

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
warn_unused_ignores = true

[tool.django-stubs]
django_settings_module = "core.settings.dev"
