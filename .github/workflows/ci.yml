name: CI/CD Pipeline

on:
  push:
    branches: [main, master, staging]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint, Formatação e Tipagem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv e Python 3.12
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Instalar Dependências de Desenvolvimento
        run: uv sync --extra dev

      - name: Executar Ruff Linter
        run: uv run ruff check .

      - name: Verificar Formatação de Código
        run: uv run ruff format --check .

      - name: Checagem Estática de Tipagem (Mypy)
        run: uv run mypy apps/ core/ || true

  security-sast:
    name: SAST, Auditoria de Dependências e Segredos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar uv e Python 3.12
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Instalar Ferramentas de Auditoria
        run: uv sync --extra dev

      - name: Scan de Vulnerabilidades de Código (Bandit)
        run: uv run bandit -r apps/ core/ -s B101

      - name: Auditoria de Vulnerabilidades em Dependências (pip-audit)
        run: uv run pip-audit -r requirements.txt

      - name: Detecção de Segredos Vazados (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests-and-quality:
    name: Testes Automatizados com PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zapbot_test_db
          POSTGRES_USER: zapbot_user
          POSTGRES_PASSWORD: test_strong_password_123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22 e Build de Assets
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build:css

      - name: Setup Python 3.12 e uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Instalar Dependências
        run: uv sync --extra dev

      - name: Validar Migrações Pendentes
        run: uv run python manage.py makemigrations --check
        env:
          USE_SQLITE: "1"

      - name: Validar Configurações de Deploy (manage.py check --deploy)
        run: uv run python manage.py check --deploy
        env:
          DJANGO_SETTINGS_MODULE: core.settings.prod
          SECRET_KEY: "a-very-long-and-secure-random-secret-key-with-over-50-characters"
          ALLOWED_HOSTS: "app.example.com,localhost"
          EVOLUTION_WEBHOOK_SECRET: "ci-secret-for-webhook-validation-12345"
          DB_PASSWORD: "test_strong_password_123"

      - name: Executar Suíte de Testes com Cobertura Mínima (>= 85%)
        run: uv run pytest --cov=apps --cov-report=term-missing --cov-fail-under=85 tests/
        env:
          USE_SQLITE: "1"
          SECRET_KEY: "ci-test-secret-key-only-for-automated-tests"

  docker-build-and-scan:
    name: Build Docker, Trivy Scan e SBOM
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, security-sast, tests-and-quality]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da Imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: zapbot:ci-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Varredura de Vulnerabilidades da Imagem (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: zapbot:ci-latest
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "HIGH,CRITICAL"

      - name: Geração de SBOM (Software Bill of Materials)
        uses: anchore/sbom-action@v0
        with:
          image: zapbot:ci-latest
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload Artifact SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json

